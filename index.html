<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canvass Nuove Attivazioni — Mosnel</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bordeaux:#6b1f2a;          /* accento primario — bottoni, brand, negativo, numeri chiave */
  --bordeaux-dark:#4f1620;
  --rosso-tenue:#6b1f2a;       /* alias di bordeaux, usato per gli stati negativi */
  --oro:#a9822e;               /* accento secondario — positivo (saldo+) e prestige */
  --oro-dark:#7a5c0a;          /* oro scuro — testo su tint oro */
  --oro-tint:#f5ecd6;          /* tint oro chiaro */
  --oro-tint2:#efe0bb;         /* tint oro medio — badge/righe positive */
  --rosso-tint:#f3e2e0;        /* tint bordeaux chiaro — badge/righe negative */
  --verde-scuro:#241c16;       /* inchiostro — titoli ed enfasi (nome storico, ora = inchiostro) */
  --crema:#efe9de;             /* pergamena — sfondo pagina */
  --carta:#fbf9f4;             /* crema chiaro — card */
  --bordo:#e2d9c4;             /* hairline pergamena */
  --header-bg:#f2ede0;         /* fondo neutro intestazione tabella */
  --testo:#241c16;             /* inchiostro primario */
  --testo-mut:#7a6f5f;         /* testo secondario */
  --ombra:0 1px 2px rgba(36,28,22,.05), 0 4px 14px -6px rgba(36,28,22,.12);
  --raggio:10px;
  --raggio-sm:6px;
  --font-display:'Playfair Display',serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--crema);
  color:var(--testo);
  min-height:100vh;
}
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
h1,h2,h3,.display{font-family:var(--font-display);}

/* ---------- layout shell ---------- */
#app{max-width:1320px;margin:0 auto;padding:24px 28px 80px;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 0 22px;border-bottom:1px solid var(--bordo);margin-bottom:24px;
  flex-wrap:wrap;gap:14px;
}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{
  width:42px;height:42px;border-radius:8px;
  background:var(--bordeaux);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px;
  font-family:var(--font-display);
  box-shadow:var(--ombra);
}
.brand-title{font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--verde-scuro);line-height:1.1;}
.brand-sub{font-size:12.5px;color:var(--testo-mut);margin-top:2px;}
.topbar-actions{display:flex;gap:10px;flex-wrap:wrap;}

button{font-family:inherit;cursor:pointer;border:none;}
.btn{
  padding:10px 16px;border-radius:8px;font-size:13.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;transition:transform .12s ease, box-shadow .12s ease;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--bordeaux);color:#fff;box-shadow:0 4px 14px -4px rgba(107,31,42,.4);}
.btn-primary:hover{background:var(--bordeaux-dark);}
.btn-ghost{background:var(--carta);color:var(--verde-scuro);border:1px solid var(--bordo);}
.btn-ghost:hover{border-color:var(--bordeaux);}
.btn-sm{padding:7px 12px;font-size:12.5px;}
.btn-danger-ghost{background:var(--carta);color:var(--rosso-tenue);border:1px solid #e6cac5;}

/* ---------- import screen ---------- */
.import-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;}
.dropzone{
  width:100%;max-width:640px;border:2px dashed #d9c9ae;border-radius:var(--raggio);
  background:var(--carta);padding:56px 32px;transition:.15s;
}
.dropzone.drag{border-color:var(--bordeaux);background:var(--rosso-tint);}
.dropzone-icon{font-size:44px;margin-bottom:10px;}
.dropzone h2{margin:0 0 8px;font-size:23px;color:var(--verde-scuro);}
.dropzone p{color:var(--testo-mut);font-size:14px;margin:0 0 20px;}
.hidden{display:none !important;}

.import-report{
  max-width:640px;width:100%;text-align:left;background:var(--carta);border:1px solid var(--bordo);
  border-radius:var(--raggio);padding:22px 24px;margin-top:18px;box-shadow:var(--ombra);
}
.import-report h3{margin:0 0 12px;font-size:15px;color:var(--verde-scuro);}
.import-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
.import-stat{background:var(--header-bg);border-radius:var(--raggio-sm);padding:12px;text-align:center;}
.import-stat b{display:block;font-size:20px;color:var(--bordeaux);font-family:var(--font-mono);}
.import-stat span{font-size:11px;color:var(--testo-mut);}
.import-warn{font-size:12.5px;color:var(--testo-mut);background:#f7f7f2;border-radius:8px;padding:10px 12px;margin-top:6px;}
.import-warn b{color:var(--rosso-tenue);}

/* ---------- dashboard ---------- */
.controls-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:20px;}
.periodo-pill{
  display:flex;align-items:center;gap:6px;background:var(--carta);border:1px solid var(--bordo);
  padding:8px 14px;border-radius:999px;font-size:13px;flex-wrap:wrap;
}
.periodo-pill select{
  border:none;font-family:var(--font-mono);font-size:13px;color:var(--verde-scuro);font-weight:600;background:transparent;
  -webkit-appearance:none;appearance:none;cursor:pointer;padding:2px 4px;
}
.periodo-pill select:focus{outline:none;}
.periodo-arrow{color:var(--testo-mut);}
.search-box{
  display:flex;align-items:center;gap:8px;background:var(--carta);border:1px solid var(--bordo);
  padding:8px 14px;border-radius:999px;min-width:230px;
}
.search-box input{border:none;outline:none;font-family:inherit;font-size:13px;flex:1;background:transparent;}

.orologio-note{
  background:var(--oro-tint);border:1px solid #e2cc98;border-radius:8px;
  padding:11px 16px;font-size:12.5px;color:#5c4508;margin-bottom:18px;line-height:1.5;
}
.orologio-note b{color:#43310a;}

.summary-cards{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:12px;margin-bottom:24px;}
.card{background:var(--carta);border:1px solid var(--bordo);border-radius:var(--raggio);padding:18px 20px;box-shadow:var(--ombra);}
.card-total{background:var(--bordeaux);color:#fff;border:none;}
.card-label{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;opacity:.85;font-weight:600;}
.card-total .card-label{color:#f0d6d3;}
.card:not(.card-total) .card-label{color:var(--testo-mut);}
.card-value{font-family:var(--font-mono);font-weight:600;font-size:28px;margin-top:6px;}
.card-total .card-value{font-size:36px;}
.card-sub{font-size:12px;margin-top:6px;opacity:.8;}

.table-wrap{background:var(--carta);border:1px solid var(--bordo);border-radius:var(--raggio);overflow:hidden;box-shadow:var(--ombra);}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead th{
  text-align:left;padding:12px 14px;background:var(--header-bg);color:var(--testo-mut);
  font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;white-space:nowrap;
  position:sticky;top:0;border-bottom:2px solid var(--bordeaux);
}
thead th:hover{color:var(--bordeaux);}
tbody tr{border-top:1px solid var(--bordo);border-left:3px solid transparent;cursor:pointer;transition:background .1s;}
tbody tr.row-pos{border-left-color:var(--oro);}
tbody tr.row-neg{border-left-color:var(--bordeaux);}
tbody tr.row-zero{border-left-color:#cbc3ab;}
tbody tr:hover{background:var(--header-bg);}
tbody td{padding:11px 14px;}
tbody td:first-child{font-weight:500;}
.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--font-mono);}
.tot-cell{font-weight:600;color:var(--bordeaux);}
.saldo-badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;
  font-family:var(--font-mono);
}
.saldo-pos{background:var(--oro-tint2);color:var(--oro-dark);}
.saldo-neg{background:var(--rosso-tint);color:var(--rosso-tenue);}
.saldo-zero{background:#f1ede1;color:var(--testo-mut);}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
.dot-pos{background:var(--oro);}
.dot-neg{background:var(--rosso-tenue);}
.dot-zero{background:#cbc3ab;}

/* ---------- modal ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(36,28,22,.4);backdrop-filter:blur(2px);
  display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;z-index:50;overflow-y:auto;
}
.modal{background:var(--carta);border-radius:14px;max-width:760px;width:100%;box-shadow:0 20px 60px -12px rgba(36,28,22,.35);}
.modal-header{display:flex;align-items:flex-start;justify-content:space-between;padding:24px 26px 16px;border-bottom:1px solid var(--bordo);}
.modal-header h2{margin:0;font-size:21px;color:var(--verde-scuro);}
.modal-header p{margin:4px 0 0;font-size:13px;color:var(--testo-mut);}
.modal-close{background:var(--header-bg);color:var(--verde-scuro);width:32px;height:32px;border-radius:50%;font-size:16px;}
.modal-body{padding:20px 26px 26px;max-height:70vh;overflow-y:auto;}
.modal-section{margin-bottom:22px;}
.modal-section h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--testo-mut);margin:0 0 10px;}
.event-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:6px;background:#f5f1e6;margin-bottom:6px;font-size:13.5px;}
.event-row .ev-left{display:flex;flex-direction:column;}
.event-row .ev-cli{font-weight:600;}
.ev-code{font-weight:400;color:var(--testo-mut);font-size:11px;margin-left:5px;font-family:var(--font-mono);}
.event-row .ev-meta{font-size:11.5px;color:var(--testo-mut);}
.event-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:5px;text-transform:uppercase;letter-spacing:.03em;}
.tag-attivazione{background:var(--oro-tint2);color:var(--oro-dark);}
.tag-gettone{background:var(--oro-tint);color:var(--oro);}
.tag-perso{background:var(--rosso-tint);color:var(--rosso-tenue);}
.ev-value{font-weight:600;font-variant-numeric:tabular-nums;font-family:var(--font-mono);}
.empty-note{font-size:13px;color:var(--testo-mut);font-style:italic;padding:8px 0;}
.modal-total{
  display:flex;justify-content:space-between;align-items:center;background:var(--verde-scuro);color:#fff;
  border-radius:10px;padding:16px 20px;margin-top:6px;
}
.modal-total b{font-family:var(--font-mono);font-size:24px;}

/* ---------- parametri modal ---------- */
.param-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;}
.param-field{display:flex;flex-direction:column;gap:5px;}
.param-field label{font-size:12px;color:var(--testo-mut);font-weight:600;}
.param-field .hint{font-size:10.5px;color:#a89a7d;}
.param-field input{
  border:1px solid var(--bordo);border-radius:8px;padding:9px 11px;font-family:var(--font-mono);font-size:14px;
  background:var(--crema);
}
.param-field input:focus{outline:none;border-color:var(--bordeaux);background:#fff;}
.param-divider{grid-column:1/-1;border-top:1px solid var(--bordo);margin:6px 0;padding-top:10px;font-size:12px;font-weight:700;color:var(--bordeaux);text-transform:uppercase;letter-spacing:.03em;}

.footer-note{text-align:center;color:var(--testo-mut);font-size:11.5px;margin-top:36px;}
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">M</div>
      <div>
        <div class="brand-title">Canvass Nuove Attivazioni</div>
        <div class="brand-sub">Calcolo premi rete agenti — Mosnel</div>
      </div>
    </div>
    <div class="topbar-actions" id="topbarActions"></div>
  </div>

  <div id="screenImport"></div>
  <div id="screenDashboard" class="hidden"></div>

</div>

<div id="modalRoot"></div>

<script>
/* =========================================================================
   CANVASS NUOVE ATTIVAZIONI — motore di calcolo premi rete agenti Mosnel
   Un solo file HTML, nessun backend, nessuna dipendenza dati esterna.
   ========================================================================= */

/* ---------------- 1. PARAMETRI DI DEFAULT (piano incentivi) ---------------- */
const PARAMETRI_DEFAULT = {
  premio3: 40,
  premio4: 50,
  premio5: 60,
  gettonePrestige: 40,
  retentionValore: 50,
  referenzeMinime: 3,
  casseMinimePerReferenza: 1,   // 1 cassa = 6 bottiglie
  finestraMesi: 12,
  ordineMinimoCasse: 8,         // 7+1 = 7 pagate + 1 omaggio = 8 casse totali
  periodoInizio: null,          // 'YYYY-MM', calcolato al primo avvio
  periodoFine: null
};

function defaultPeriodo(){
  const now = new Date();
  const anno = now.getFullYear();
  return { inizio: anno + '-09', fine: anno + '-12' };
}

/* ---------------- 2. STATO GLOBALE ---------------- */
let STATE = {
  rows: [],            // righe grezze filtrate, una per riga Excel
  orders: [],          // righe aggregate per ordine (Cod_Cli + Num_Doc)
  importReport: null,  // { totRighe, scartate, agenti, clienti, dataMin, dataMax, motivi }
  parametri: JSON.parse(JSON.stringify(PARAMETRI_DEFAULT)),
  risultati: [],        // output motore di calcolo, un elemento per agente
  sortCol: 'totale',
  sortDir: 'desc',
  search: ''
};

const LS_KEY = 'canvass_mosnel_v1';
const SCHEMA_VERSION = 2; // incrementare ogni volta che cambia la struttura dei dati salvati

/* ---------------- 3. IMPORT & FILTRI EXCEL ---------------- */

function normalizza(s){ return (s===undefined||s===null) ? '' : String(s).trim(); }

function importaExcel(file){
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const wb = XLSX.read(e.target.result, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(sheet, {defval:''});
      processaImport(json);
    }catch(err){
      alert('Errore nella lettura del file: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function processaImport(json){
  let scartate = 0;
  const motivi = {};
  const scarta = (motivo)=>{ scartate++; motivi[motivo]=(motivi[motivo]||0)+1; };

  const AGENTI_ESCLUSI = new Set(['999','99','95']);
  const rows = [];

  json.forEach(r=>{
    const codAge = normalizza(r.Cod_Age);
    const nomeAgente = normalizza(r.Nome_Agente);
    const stato = normalizza(r.Stato).toUpperCase();
    const descr = normalizza(r.Descr_Merceologica);
    const nomeUp = nomeAgente.toUpperCase();

    // --- Filtri fissi (identici alla logica validata nel foglio Excel) ---
    if (AGENTI_ESCLUSI.has(codAge)) { scarta('agente escluso (999/99/95)'); return; }
    if (nomeUp.includes('PROVA') || nomeUp.includes('WINE CLUB')) { scarta('agente PROVA/WINE CLUB'); return; }
    if (descr.toUpperCase() === 'FONTECOLO') { scarta('riga FONTECOLO (olio)'); return; }
    if (!descr) { scarta('riga senza referenza'); return; }
    if (stato !== '_ITALIA') { scarta('Stato diverso da _ITALIA'); return; }

    const anno = parseInt(r.Anno, 10);
    const mese = parseInt(r.Mese, 10);
    if (!anno || !mese) { scarta('Anno/Mese mancante o non valido'); return; }

    rows.push({
      codCli: normalizza(r.Cod_Cli),
      ragioneSociale: normalizza(r.Ragione_Sociale),
      codAge: codAge || nomeAgente,
      nomeAgente: nomeAgente || ('Agente ' + codAge),
      anno, mese,
      numDoc: normalizza(r.Num_Doc),
      descrMerc: descr,
      qtaPezzi: parseFloat(r.Qta_Pezzi) || 0,
      importoNetto: parseFloat(r.Importo_Netto) || 0,
      regione: normalizza(r.Regione),
      stato
    });
  });

  const orders = buildOrders(rows);

  const agenti = new Set(rows.map(r=>r.codAge));
  const clienti = new Set(rows.map(r=>r.codCli));
  let dataMin = null, dataMax = null;
  rows.forEach(r=>{
    const idx = r.anno*12+r.mese;
    if(dataMin===null || idx<dataMin) dataMin = idx;
    if(dataMax===null || idx>dataMax) dataMax = idx;
  });

  STATE.rows = rows;
  STATE.orders = orders;
  STATE.nomiClienti = buildNomiClienti(rows);
  STATE.importReport = {
    totRighe: json.length,
    righeValide: rows.length,
    scartate, motivi,
    agenti: agenti.size,
    clienti: clienti.size,
    dataMin, dataMax
  };

  if(!STATE.parametri.periodoInizio){
    const p = defaultPeriodo();
    STATE.parametri.periodoInizio = p.inizio;
    STATE.parametri.periodoFine = p.fine;
  }

  ricalcola();
  salvaLocale();
  renderImportReport();
}

// Aggrega le righe per ordine (Cod_Cli + Num_Doc): un ordine puo' contenere piu' referenze
function buildOrders(rows){
  const map = new Map();
  rows.forEach(r=>{
    const key = r.codCli + '||' + r.numDoc;
    if(!map.has(key)){
      map.set(key, {
        codCli: r.codCli, numDoc: r.numDoc,
        codAge: r.codAge, nomeAgente: r.nomeAgente,
        anno: r.anno, mese: r.mese, monthIndex: r.anno*12+r.mese,
        referenze: new Map(), // descrizione -> qta pezzi totale
        importoNetto: 0
      });
    }
    const o = map.get(key);
    o.referenze.set(r.descrMerc, (o.referenze.get(r.descrMerc)||0) + r.qtaPezzi);
    o.importoNetto += r.importoNetto;
  });
  return Array.from(map.values());
}

// Ricava il nome cliente (ragione sociale) da mostrare al posto del solo Cod_Cli.
// Nel file sorgente non e' presente una colonna "Insegna" separata: si usa la ragione sociale.
function buildNomiClienti(rows){
  const map = new Map();
  rows.forEach(r=>{
    if(!map.has(r.codCli) && r.ragioneSociale){
      map.set(r.codCli, r.ragioneSociale);
    }
  });
  return map;
}

function nomeCliente(codCli){
  const nome = STATE.nomiClienti && STATE.nomiClienti.get(codCli);
  return nome || ('Cliente ' + codCli);
}

/* ---------------- 4. MOTORE DI CALCOLO PREMI ---------------- */
/*
  Per ogni cliente si ricostruisce l'intero storico ordini (non solo il
  periodo selezionato), perche' per stabilire se un cliente e' "nuovo" o
  "perso" serve la finestra mobile di 12 mesi che puo' guardare fuori dal
  periodo. I premi vengono pero' SEMPRE attribuiti solo se l'evento generatore
  (primo ordine qualificante, prima referenza prestige, perdita del cliente)
  cade dentro il periodo selezionato.
*/
function meseAIndice(str){ // 'YYYY-MM' -> intero comparabile
  const [y,m] = str.split('-').map(Number);
  return y*12+m;
}

function motoreCalcolo(orders, parametri){
  const startIdx = meseAIndice(parametri.periodoInizio);
  const endIdx = meseAIndice(parametri.periodoFine);
  const {
    finestraMesi, casseMinimePerReferenza, referenzeMinime, ordineMinimoCasse,
    premio3, premio4, premio5, gettonePrestige, retentionValore
  } = parametri;

  // Raggruppa ordini per cliente, ordinati cronologicamente
  const clientMap = new Map();
  orders.forEach(o=>{
    if(!clientMap.has(o.codCli)) clientMap.set(o.codCli, []);
    clientMap.get(o.codCli).push(o);
  });
  clientMap.forEach(list=>list.sort((a,b)=>a.monthIndex-b.monthIndex));

  const agentiMap = new Map(); // codAge -> risultati (solo Orologio 1: attivazioni + gettoni)
  function agente(codAge, nome){
    if(!agentiMap.has(codAge)){
      agentiMap.set(codAge, { codAge, nome, attivazioni:[], gettoni:[] });
    }
    const a = agentiMap.get(codAge);
    if(nome) a.nome = nome;
    return a;
  }

  clientMap.forEach((storicoOrdini, codCli)=>{
    const ordiniPeriodo = storicoOrdini.filter(o=>o.monthIndex>=startIdx && o.monthIndex<=endIdx);

    // ---- 4.1 PREMIO ATTIVAZIONE (regola: nuovo cliente + N referenze + ordine minimo) ----
    if(ordiniPeriodo.length>0){
      const primoOrdine = ordiniPeriodo[0];
      const haStoricoRecente = storicoOrdini.some(o =>
        o.monthIndex < primoOrdine.monthIndex &&
        o.monthIndex >= primoOrdine.monthIndex - finestraMesi
      );
      const isNuovo = !haStoricoRecente;

      const refEntries = Array.from(primoOrdine.referenze.entries()).map(([descr, qta])=>({
        descr, casse: qta/6
      }));
      const referenzeValide = refEntries.filter(r => r.casse >= casseMinimePerReferenza);
      const totaleCasseOrdine = refEntries.reduce((s,r)=>s+r.casse, 0);

      if(isNuovo && referenzeValide.length >= referenzeMinime && totaleCasseOrdine >= ordineMinimoCasse){
        const fascia = referenzeValide.length >= 5 ? 5 : referenzeValide.length; // 3, 4 o 5+
        const premio = fascia === 3 ? premio3 : fascia === 4 ? premio4 : premio5;
        const ag = agente(primoOrdine.codAge, primoOrdine.nomeAgente);
        ag.attivazioni.push({
          codCli, monthIndex: primoOrdine.monthIndex, fascia, premio,
          referenze: referenzeValide.map(r=>r.descr)
        });
      }
    }

    // ---- 4.2 GETTONE PRESTIGE (prima volta EBB o Parose in assoluto, su tutto lo storico) ----
    let ebbGiaAvuto = false, paroseGiaAvuto = false;
    storicoOrdini.forEach(o=>{
      let presenteEBB = false, presenteParose = false;
      o.referenze.forEach((qta, descr)=>{
        const d = descr.toUpperCase();
        if(qta > 0 && d.includes('EBB')) presenteEBB = true;
        if(qta > 0 && d.includes('PAROS')) presenteParose = true; // copre Parose/Parosé
      });
      const inPeriodo = o.monthIndex >= startIdx && o.monthIndex <= endIdx;

      if(presenteEBB && !ebbGiaAvuto){
        if(inPeriodo){
          const ag = agente(o.codAge, o.nomeAgente);
          ag.gettoni.push({ codCli, monthIndex:o.monthIndex, referenza:'EBB', importo:gettonePrestige });
        }
        ebbGiaAvuto = true;
      }
      if(presenteParose && !paroseGiaAvuto){
        if(inPeriodo){
          const ag = agente(o.codAge, o.nomeAgente);
          ag.gettoni.push({ codCli, monthIndex:o.monthIndex, referenza:'Parosé', importo:gettonePrestige });
        }
        paroseGiaAvuto = true;
      }
    });
  });

  // ---- 4.4 TOTALI PER AGENTE (solo Orologio 1: premi attivazione + gettoni) ----
  const risultati = new Map();
  agentiMap.forEach((ag, codAge)=>{
    const totPremiAttivazione = ag.attivazioni.reduce((s,a)=>s+a.premio, 0);
    const totGettoni = ag.gettoni.reduce((s,g)=>s+g.importo, 0);
    risultati.set(codAge, {
      ...ag,
      nuoviQualificati: ag.attivazioni.length, // premio-qualificati: 3+ referenze, ordine minimo (leva 1)
      totPremiAttivazione, totGettoni
    });
  });

  return risultati;
}

/* ---------------- 4bis. MOTORE SALDO NETTO ANNUO — "OROLOGIO 2" (indipendente dal periodo campagna) ---------------- */
/*
  Un cliente HORECA tipico riordina ogni 3-4 mesi: se il saldo netto (usato SOLO per il bonus
  retention) venisse calcolato guardando solo i mesi della campagna (es. Set-Dic, 4 mesi), qualunque
  cliente il cui ciclo di riordino non cada per caso in quella finestra corta risulterebbe "perso"
  anche se in realta' e' un cliente regolare che comprera' a gennaio o a maggio.

  Per questo il saldo netto usa un orologio completamente separato dal periodo campagna:
  - Si guardano SEMPRE i 12 mesi pieni che terminano con la fine del periodo campagna (periodoFine),
    a prescindere da quale inizio periodo l'utente abbia scelto in dashboard.
  - Si confrontano con i 12 mesi pieni immediatamente precedenti.
  - Per ogni agente si calcola l'insieme dei clienti da lui serviti in ciascuna delle due finestre
    (non "a quale agente attribuire il singolo cliente": un cliente puo' benissimo comparire nella
    finestra di un agente e in quella di un altro se e' stato riassegnato nel tempo — si guarda cosa
    e' successo REALMENTE sotto ciascun agente, finestra per finestra).
  - Nuovi netti (per l'agente) = clienti presenti nella finestra corrente ma non in quella precedente.
  - Persi netti (per l'agente)  = clienti presenti nella finestra precedente ma non in quella corrente.
  Questi due insiemi possono includere ordini che cadono FUORI dal periodo campagna scelto (es. un
  cliente che ha comprato a marzo e non e' piu' tornato: e' "perso" ai fini della retention anche se
  marzo non fa parte del periodo Set-Dic).
*/
function calcolaSaldoNettoAnnuo(orders, parametri){
  const endIdx = meseAIndice(parametri.periodoFine);
  const finestra = parametri.finestraMesi;
  const winBStart = endIdx - finestra + 1, winBEnd = endIdx;               // finestra corrente
  const winAStart = winBStart - finestra, winAEnd = winBStart - 1;         // finestra precedente

  const clientiB = new Map(); // codAge -> Map(codCli -> ultimo ordine in finestra B, per data display)
  const clientiA = new Map(); // codAge -> Map(codCli -> ultimo ordine in finestra A)
  const nomi = new Map();

  orders.forEach(o=>{
    nomi.set(o.codAge, o.nomeAgente);
    if(o.monthIndex >= winBStart && o.monthIndex <= winBEnd){
      if(!clientiB.has(o.codAge)) clientiB.set(o.codAge, new Map());
      const m = clientiB.get(o.codAge);
      if(!m.has(o.codCli) || o.monthIndex < m.get(o.codCli)) m.set(o.codCli, o.monthIndex); // primo ordine nella finestra
    }
    if(o.monthIndex >= winAStart && o.monthIndex <= winAEnd){
      if(!clientiA.has(o.codAge)) clientiA.set(o.codAge, new Map());
      const m = clientiA.get(o.codAge);
      if(!m.has(o.codCli) || o.monthIndex > m.get(o.codCli)) m.set(o.codCli, o.monthIndex); // ultimo ordine nella finestra
    }
  });

  const tuttiAgenti = new Set([...clientiB.keys(), ...clientiA.keys()]);
  const risultato = new Map();
  tuttiAgenti.forEach(codAge=>{
    const mapB = clientiB.get(codAge) || new Map();
    const mapA = clientiA.get(codAge) || new Map();
    const nuoviNetti = [];
    mapB.forEach((monthIndex, codCli)=>{ if(!mapA.has(codCli)) nuoviNetti.push({ codCli, monthIndex }); });
    const persiNetti = [];
    mapA.forEach((monthIndex, codCli)=>{ if(!mapB.has(codCli)) persiNetti.push({ codCli, ultimoAcquisto: monthIndex }); });
    risultato.set(codAge, { codAge, nome: nomi.get(codAge), nuoviNetti, persiNetti, winBStart, winBEnd, winAStart, winAEnd });
  });
  return risultato;
}

/* ---------------- 4ter. UNIONE DEI DUE OROLOGI + TOTALI FINALI PER AGENTE ---------------- */
function ricalcola(){
  if(STATE.orders.length===0) return;
  const orologio1 = motoreCalcolo(STATE.orders, STATE.parametri);   // attivazioni + gettoni (periodo campagna)
  const orologio2 = calcolaSaldoNettoAnnuo(STATE.orders, STATE.parametri); // saldo netto annuo (retention)

  const tuttiAgenti = new Set([...orologio1.keys(), ...orologio2.keys()]);
  const retentionValore = STATE.parametri.retentionValore;

  const risultati = [];
  tuttiAgenti.forEach(codAge=>{
    const o1 = orologio1.get(codAge) || { codAge, nome:null, attivazioni:[], gettoni:[], nuoviQualificati:0, totPremiAttivazione:0, totGettoni:0 };
    const o2 = orologio2.get(codAge) || { codAge, nome:null, nuoviNetti:[], persiNetti:[] };
    const nome = o1.nome || o2.nome || codAge;
    const saldoNetto = o2.nuoviNetti.length - o2.persiNetti.length;
    const retention = saldoNetto > 0 ? saldoNetto * retentionValore : 0;
    risultati.push({
      codAge, nome,
      attivazioni: o1.attivazioni, gettoni: o1.gettoni,
      nuoviQualificati: o1.nuoviQualificati,
      totPremiAttivazione: o1.totPremiAttivazione, totGettoni: o1.totGettoni,
      nuoviNetti: o2.nuoviNetti, persiNetti: o2.persiNetti,
      nuoviNettiCount: o2.nuoviNetti.length, persiNettiCount: o2.persiNetti.length,
      saldoNetto, retention,
      totale: o1.totPremiAttivazione + o1.totGettoni + retention
    });
  });

  STATE.risultati = risultati;
}

function meseLabel(idx){
  if(idx===null||idx===undefined) return '—';
  const anno = Math.floor((idx-1)/12);
  const mese = idx - anno*12;
  const nomi = ['','Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
  return nomi[mese] + ' ' + anno;
}

/* ---------------- 7. RENDER: DASHBOARD ---------------- */
function fmt(n){ return '€ ' + Math.round(n).toLocaleString('it-IT'); }

// Selettori mese/anno "a prova di browser": Safari non supporta <input type="month">,
// quindi il periodo campagna si sceglie con due <select> invece dell'input nativo.
const NOMI_MESE = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];

function selectMese(id, valorePeriodo){
  const meseSel = valorePeriodo ? parseInt(valorePeriodo.split('-')[1], 10) : (new Date().getMonth()+1);
  const opzioni = NOMI_MESE.map((nome,i)=>{
    const m = i+1;
    const mm = String(m).padStart(2,'0');
    return `<option value="${mm}" ${m===meseSel?'selected':''}>${nome}</option>`;
  }).join('');
  return `<select id="${id}">${opzioni}</select>`;
}

function selectAnno(id, valorePeriodo){
  const annoSel = valorePeriodo ? parseInt(valorePeriodo.split('-')[0], 10) : new Date().getFullYear();
  // range di anni: da quelli presenti nei dati importati (con margine), cosi' copre sempre il file caricato
  let annoMin = annoSel-1, annoMax = annoSel+1;
  if(STATE.importReport && STATE.importReport.dataMin && STATE.importReport.dataMax){
    annoMin = Math.min(annoMin, Math.floor((STATE.importReport.dataMin-1)/12));
    annoMax = Math.max(annoMax, Math.floor((STATE.importReport.dataMax-1)/12));
  }
  let opzioni = '';
  for(let y=annoMin; y<=annoMax; y++){
    opzioni += `<option value="${y}" ${y===annoSel?'selected':''}>${y}</option>`;
  }
  return `<select id="${id}">${opzioni}</select>`;
}

const COLONNE = [
  {key:'nome', label:'Agente'},
  {key:'nuoviNettiCount', label:'Nuovi (12 mesi)', num:true},
  {key:'persiNettiCount', label:'Persi (12 mesi)', num:true},
  {key:'saldoNetto', label:'Saldo netto', num:true},
  {key:'totPremiAttivazione', label:'Premi attiv.', num:true},
  {key:'totGettoni', label:'Prestige', num:true},
  {key:'retention', label:'Retention', num:true},
  {key:'totale', label:'Totale', num:true}
];

function renderTable(){
  const head = document.getElementById('tableHead');
  const body = document.getElementById('tableBody');
  if(!head || !body) return;

  head.innerHTML = COLONNE.map(c=>{
    const arrow = STATE.sortCol===c.key ? (STATE.sortDir==='desc'?' ↓':' ↑') : '';
    const titolo = (c.key==='nuoviNettiCount'||c.key==='persiNettiCount'||c.key==='saldoNetto')
      ? ` title="Calcolato sui ${STATE.parametri.finestraMesi} mesi terminanti a ${p_meseLungo(STATE.parametri.periodoFine)}, non solo sul periodo campagna"`
      : '';
    return `<th onclick="ordinaPer('${c.key}')"${titolo}>${c.label}${arrow}</th>`;
  }).join('');

  let rows = STATE.risultati.slice();
  if(STATE.search.trim()){
    const q = STATE.search.toLowerCase();
    rows = rows.filter(r => (r.nome||'').toLowerCase().includes(q));
  }
  rows.sort((a,b)=>{
    const dir = STATE.sortDir==='desc' ? -1 : 1;
    const av = a[STATE.sortCol], bv = b[STATE.sortCol];
    if(typeof av === 'string') return av.localeCompare(bv)*dir;
    return (av-bv)*dir;
  });

  if(rows.length===0){
    body.innerHTML = `<tr><td colspan="${COLONNE.length}" style="padding:30px;text-align:center;color:var(--testo-mut);">Nessun agente trovato con i filtri attuali.</td></tr>`;
    return;
  }

  body.innerHTML = rows.map(r=>{
    const saldoClass = r.saldoNetto>0?'saldo-pos':(r.saldoNetto<0?'saldo-neg':'saldo-zero');
    const dotClass = r.saldoNetto>0?'dot-pos':(r.saldoNetto<0?'dot-neg':'dot-zero');
    const rowClass = r.saldoNetto>0?'row-pos':(r.saldoNetto<0?'row-neg':'row-zero');
    return `
      <tr class="${rowClass}" onclick="apriDettaglioAgente('${r.codAge.replace(/'/g,"\\'")}')">
        <td>${r.nome}</td>
        <td class="num">${r.nuoviNettiCount}</td>
        <td class="num">${r.persiNettiCount}</td>
        <td class="num"><span class="saldo-badge ${saldoClass}"><span class="dot ${dotClass}"></span>${r.saldoNetto>0?'+':''}${r.saldoNetto}</span></td>
        <td class="num">${fmt(r.totPremiAttivazione)}</td>
        <td class="num">${fmt(r.totGettoni)}</td>
        <td class="num">${fmt(r.retention)}</td>
        <td class="num tot-cell">${fmt(r.totale)}</td>
      </tr>
    `;
  }).join('');
}

function ordinaPer(key){
  if(STATE.sortCol===key){ STATE.sortDir = STATE.sortDir==='desc'?'asc':'desc'; }
  else { STATE.sortCol = key; STATE.sortDir = 'desc'; }
  renderTable();
}

        <div class="modal-body">
          <div class="modal-section">
            <h4>Nuove attivazioni qualificate — premio a scala (${ag.attivazioni.length})</h4>
            ${eventiAttivazione}
          </div>
          <div class="modal-section">
            <h4>Gettoni prestige EBB / Parosé (${ag.gettoni.length})</h4>
            ${eventiGettone}
          </div>
          <div class="modal-section">
            <h4>Saldo netto annuo — per la retention (saldo ${ag.saldoNetto>0?'+':''}${ag.saldoNetto})</h4>
            <p style="font-size:12px;color:var(--testo-mut);margin:-4px 0 12px;">${notaOrologio2}</p>
            <div style="font-size:12px;font-weight:700;color:var(--oro-dark);text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px;">Nuovi netti (${ag.nuoviNetti.length})</div>
            ${eventiNuoviNetti}
            <div style="font-size:12px;font-weight:700;color:var(--rosso-tenue);text-transform:uppercase;letter-spacing:.03em;margin:16px 0 8px;">Persi netti (${ag.persiNetti.length})</div>
            ${eventiPersi}
          </div>
          <div class="modal-total">
            <span>Totale da liquidare</span>
            <b>${fmt(ag.totale)}</b>
          </div>
        </div>
      </div>
    </div>
  `;
}
function p_meseLungo(str){
  if(!str) return '—';
  const [y,m] = str.split('-').map(Number);
  const nomi = ['','Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
  return nomi[m] + ' ' + y;
}

function salvaParametri(){
  const p = STATE.parametri;
  const campi = ['premio3','premio4','premio5','referenzeMinime','gettonePrestige','retentionValore','casseMinimePerReferenza','finestraMesi','ordineMinimoCasse'];
  campi.forEach(c=>{
    const v = parseFloat(document.getElementById('p_'+c).value);
    if(!isNaN(v)) p[c] = v;
  });
  ricalcola();
  salvaLocale();
  chiudiModale();
  renderDashboard();
}

function ripristinaDefault(){
  const periodoAttuale = { periodoInizio: STATE.parametri.periodoInizio, periodoFine: STATE.parametri.periodoFine };
  STATE.parametri = { ...JSON.parse(JSON.stringify(PARAMETRI_DEFAULT)), ...periodoAttuale };
  ricalcola();
  salvaLocale();
  apriParametri();
  renderDashboard();
}

/* ---------------- 10. EXPORT EXCEL ---------------- */
function esportaExcel(){
  const p = STATE.parametri;
  const righeTabella = STATE.risultati.slice().sort((a,b)=>b.totale-a.totale).map(r=>({
    'Agente': r.nome,
    'Attivazioni qualificate (premio)': r.nuoviQualificati,
    'Nuovi netti (12 mesi, per retention)': r.nuoviNettiCount,
    'Persi netti (12 mesi, per retention)': r.persiNettiCount,
    'Saldo netto (12 mesi)': r.saldoNetto,
    'Premi attivazione (€)': Math.round(r.totPremiAttivazione),
    'Gettoni prestige (€)': Math.round(r.totGettoni),
    'Retention (€)': Math.round(r.retention),
    'Totale da liquidare (€)': Math.round(r.totale)
  }));

  const totRow = {
    'Agente': 'TOTALE RETE',
    'Attivazioni qualificate (premio)': STATE.risultati.reduce((s,a)=>s+a.nuoviQualificati,0),
    'Nuovi netti (12 mesi, per retention)': STATE.risultati.reduce((s,a)=>s+a.nuoviNettiCount,0),
    'Persi netti (12 mesi, per retention)': STATE.risultati.reduce((s,a)=>s+a.persiNettiCount,0),
    'Saldo netto (12 mesi)': STATE.risultati.reduce((s,a)=>s+a.saldoNetto,0),
    'Premi attivazione (€)': Math.round(STATE.risultati.reduce((s,a)=>s+a.totPremiAttivazione,0)),
    'Gettoni prestige (€)': Math.round(STATE.risultati.reduce((s,a)=>s+a.totGettoni,0)),
    'Retention (€)': Math.round(STATE.risultati.reduce((s,a)=>s+a.retention,0)),
    'Totale da liquidare (€)': Math.round(STATE.risultati.reduce((s,a)=>s+a.totale,0))
  };
  righeTabella.push(totRow);

  const parametriRighe = [
    {Parametro:'Periodo campagna (attivazioni + gettoni) — Orologio 1', Valore: p.periodoInizio + ' → ' + p.periodoFine},
    {Parametro:'Finestra saldo netto (retention) — Orologio 2', Valore: p.finestraMesi + ' mesi terminanti a ' + p.periodoFine + ', confrontati coi ' + p.finestraMesi + ' mesi precedenti — indipendente dall\'inizio periodo campagna'},
    {Parametro:'Premio 3 referenze', Valore: p.premio3 + ' €'},
    {Parametro:'Premio 4 referenze', Valore: p.premio4 + ' €'},
    {Parametro:'Premio 5+ referenze', Valore: p.premio5 + ' €'},
    {Parametro:'Gettone prestige EBB/Parosé', Valore: p.gettonePrestige + ' €'},
    {Parametro:'Retention per cliente netto', Valore: p.retentionValore + ' €'},
    {Parametro:'Referenze minime per qualificare', Valore: p.referenzeMinime},
    {Parametro:'Casse minime per referenza valida', Valore: p.casseMinimePerReferenza},
    {Parametro:'Finestra "cliente nuovo" per attivazione (mesi)', Valore: p.finestraMesi},
    {Parametro:'Ordine minimo per qualificare (casse totali)', Valore: p.ordineMinimoCasse},
    {Parametro:'Data/ora esportazione', Valore: new Date().toLocaleString('it-IT')}
  ];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(righeTabella), 'Riepilogo agenti');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(parametriRighe), 'Parametri usati');
  XLSX.writeFile(wb, `Canvass_Liquidazione_${p.periodoInizio}_${p.periodoFine}.xlsx`);
}

/* ---------------- 11. SALVATAGGIO / RIPRESA LOCALE ---------------- */
/*
  Nota: window.localStorage funziona nell'ambiente reale (es. hostato su
  GitHub Pages, come gli altri tool Mosnel) ma puo' non persistere se il file
  viene aperto in anteprima sandbox di Claude. In quel caso l'app funziona
  comunque, semplicemente non ricorda tra una sessione e l'altra.
*/
function salvaLocale(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({
      schemaVersion: SCHEMA_VERSION,
      rows: STATE.rows, importReport: STATE.importReport,
      parametri: STATE.parametri, savedAt: new Date().toISOString()
    }));
  }catch(e){ /* storage non disponibile: si prosegue senza persistenza */ }
}

function caricaLocale(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}

function riprendiSessione(dati){
  STATE.rows = dati.rows;
  STATE.orders = buildOrders(dati.rows);
  STATE.nomiClienti = buildNomiClienti(dati.rows);
  STATE.importReport = dati.importReport;
  STATE.parametri = dati.parametri;
  ricalcola();
  vaiAllaDashboard();
}

/* ---------------- 12. AVVIO ---------------- */
function avvia(){
  renderTopbar();
  renderImportScreen();

  const salvato = caricaLocale();
  if(salvato && salvato.rows && salvato.rows.length>0){
    const wrap = document.getElementById('importReportWrap');
    const dataSalvataggio = new Date(salvato.savedAt).toLocaleString('it-IT');

    if(salvato.schemaVersion !== SCHEMA_VERSION){
      // Salvataggio di una versione precedente dell'app: puo' mancare di campi nuovi
      // (es. nome cliente). Meglio avvisare e far rifare l'import che rischiare dati incompleti.
      const banner = document.createElement('div');
      banner.className = 'import-report';
      banner.innerHTML = `
        <h3>Trovato un salvataggio precedente non aggiornato</h3>
        <p style="font-size:13px;color:var(--testo-mut);margin:0 0 14px;">
          Risale al ${dataSalvataggio}, ma è stato creato con una versione precedente dell'app
          (potrebbero mancare dati come il nome cliente). Rifai l'import del file Excel per aggiornarlo:
          verrà sovrascritto automaticamente al prossimo import.
        </p>
      `;
      wrap.prepend(banner);
      return;
    }

    window.__sessioneSalvata = salvato; // evita di iniettare JSON enorme in un attributo HTML
    const banner = document.createElement('div');
    banner.className = 'import-report';
    banner.innerHTML = `
      <h3>Calcolo precedente trovato</h3>
      <p style="font-size:13px;color:var(--testo-mut);margin:0 0 14px;">
        Ultimo salvataggio: ${dataSalvataggio} — ${salvato.rows.length.toLocaleString('it-IT')} righe importate.
      </p>
      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button class="btn btn-ghost btn-sm" onclick="this.closest('.import-report').remove()">Ignora</button>
        <button class="btn btn-primary btn-sm" onclick="riprendiSessione(window.__sessioneSalvata)">Riprendi ultimo calcolo →</button>
      </div>
    `;
    wrap.prepend(banner);
  }
}
avvia();
</script>
