<!DOCTYPE html>
<html lang="it">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canvass Nuove Attivazioni — Mosnel</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --verde-vivo:#22c55e;
  --verde-vivo-dark:#16a34a;
  --verde-scuro:#0b3d24;
  --verde-testo:#14532d;
  --verde-tint:#e9fbf0;
  --verde-tint2:#d3f7e0;
  --oro:#d4a017;
  --oro-tint:#fff6e0;
  --rosso-tenue:#e5675f;
  --rosso-tint:#fdeceb;
  --crema:#fbfbf7;
  --carta:#ffffff;
  --bordo:#e3e8e2;
  --testo:#1c231e;
  --testo-mut:#657165;
  --ombra:0 1px 2px rgba(20,50,30,.06), 0 6px 20px -8px rgba(20,50,30,.15);
  --raggio:16px;
  --raggio-sm:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--crema);
  color:var(--testo);
  min-height:100vh;
}
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap');
h1,h2,h3,.display{font-family:'Fraunces',serif;}

/* ---------- layout shell ---------- */
#app{max-width:1320px;margin:0 auto;padding:24px 28px 80px;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 0 22px;border-bottom:1px solid var(--bordo);margin-bottom:24px;
  flex-wrap:wrap;gap:14px;
}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{
  width:42px;height:42px;border-radius:12px;
  background:linear-gradient(135deg,var(--verde-vivo),var(--verde-vivo-dark));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;
  box-shadow:var(--ombra);
}
.brand-title{font-family:'Fraunces',serif;font-weight:700;font-size:20px;color:var(--verde-scuro);line-height:1.1;}
.brand-sub{font-size:12.5px;color:var(--testo-mut);margin-top:2px;}
.topbar-actions{display:flex;gap:10px;flex-wrap:wrap;}

button{font-family:inherit;cursor:pointer;border:none;}
.btn{
  padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;transition:transform .12s ease, box-shadow .12s ease;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--verde-vivo);color:#fff;box-shadow:0 4px 14px -4px rgba(34,197,94,.55);}
.btn-primary:hover{background:var(--verde-vivo-dark);}
.btn-ghost{background:var(--carta);color:var(--verde-testo);border:1px solid var(--bordo);}
.btn-ghost:hover{border-color:var(--verde-vivo);}
.btn-sm{padding:7px 12px;font-size:12.5px;}
.btn-danger-ghost{background:var(--carta);color:var(--rosso-tenue);border:1px solid #f2d4d1;}

/* ---------- import screen ---------- */
.import-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;}
.dropzone{
  width:100%;max-width:640px;border:2px dashed #b9e6c8;border-radius:var(--raggio);
  background:var(--carta);padding:56px 32px;transition:.15s;
}
.dropzone.drag{border-color:var(--verde-vivo);background:var(--verde-tint);}
.dropzone-icon{font-size:44px;margin-bottom:10px;}
.dropzone h2{margin:0 0 8px;font-size:23px;color:var(--verde-scuro);}
.dropzone p{color:var(--testo-mut);font-size:14px;margin:0 0 20px;}
.hidden{display:none !important;}

.import-report{
  max-width:640px;width:100%;text-align:left;background:var(--carta);border:1px solid var(--bordo);
  border-radius:var(--raggio);padding:22px 24px;margin-top:18px;box-shadow:var(--ombra);
}
.import-report h3{margin:0 0 12px;font-size:15px;color:var(--verde-scuro);}
.import-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
.import-stat{background:var(--verde-tint);border-radius:var(--raggio-sm);padding:12px;text-align:center;}
.import-stat b{display:block;font-size:20px;color:var(--verde-testo);font-family:'Fraunces',serif;}
.import-stat span{font-size:11px;color:var(--testo-mut);}
.import-warn{font-size:12.5px;color:var(--testo-mut);background:#f7f7f2;border-radius:8px;padding:10px 12px;margin-top:6px;}
.import-warn b{color:var(--rosso-tenue);}

/* ---------- dashboard ---------- */
.controls-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:20px;}
.periodo-pill{
  display:flex;align-items:center;gap:6px;background:var(--carta);border:1px solid var(--bordo);
  padding:8px 14px;border-radius:999px;font-size:13px;flex-wrap:wrap;
}
.periodo-pill select{
  border:none;font-family:inherit;font-size:13px;color:var(--verde-testo);font-weight:600;background:transparent;
  -webkit-appearance:none;appearance:none;cursor:pointer;padding:2px 4px;
}
.periodo-pill select:focus{outline:none;}
.periodo-arrow{color:var(--testo-mut);}
.search-box{
  display:flex;align-items:center;gap:8px;background:var(--carta);border:1px solid var(--bordo);
  padding:8px 14px;border-radius:999px;min-width:230px;
}
.search-box input{border:none;outline:none;font-family:inherit;font-size:13px;flex:1;background:transparent;}

.summary-cards{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:16px;margin-bottom:24px;}
.card{background:var(--carta);border:1px solid var(--bordo);border-radius:var(--raggio);padding:20px 22px;box-shadow:var(--ombra);}
.card-total{background:linear-gradient(135deg,var(--verde-vivo),var(--verde-vivo-dark));color:#fff;border:none;}
.card-label{font-size:12px;letter-spacing:.04em;text-transform:uppercase;opacity:.85;font-weight:600;}
.card-total .card-label{color:#eafff0;}
.card:not(.card-total) .card-label{color:var(--testo-mut);}
.card-value{font-family:'Fraunces',serif;font-weight:700;font-size:34px;margin-top:6px;}
.card-total .card-value{font-size:44px;}
.card-sub{font-size:12px;margin-top:6px;opacity:.8;}

.table-wrap{background:var(--carta);border:1px solid var(--bordo);border-radius:var(--raggio);overflow:hidden;box-shadow:var(--ombra);}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead th{
  text-align:left;padding:12px 14px;background:var(--verde-tint);color:var(--verde-testo);
  font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;white-space:nowrap;
  position:sticky;top:0;
}
thead th:hover{background:var(--verde-tint2);}
tbody tr{border-top:1px solid var(--bordo);cursor:pointer;transition:background .1s;}
tbody tr:hover{background:var(--verde-tint);}
tbody td{padding:11px 14px;}
.num{text-align:right;font-variant-numeric:tabular-nums;}
.tot-cell{font-weight:700;color:var(--verde-testo);}
.saldo-badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;
}
.saldo-pos{background:var(--verde-tint2);color:var(--verde-testo);}
.saldo-neg{background:var(--rosso-tint);color:var(--rosso-tenue);}
.saldo-zero{background:#f1f1ec;color:var(--testo-mut);}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
.dot-pos{background:var(--verde-vivo);}
.dot-neg{background:var(--rosso-tenue);}

/* ---------- modal ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(11,61,36,.35);backdrop-filter:blur(2px);
  display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;z-index:50;overflow-y:auto;
}
.modal{background:var(--carta);border-radius:20px;max-width:760px;width:100%;box-shadow:0 20px 60px -12px rgba(11,61,36,.35);}
.modal-header{display:flex;align-items:flex-start;justify-content:space-between;padding:24px 26px 16px;border-bottom:1px solid var(--bordo);}
.modal-header h2{margin:0;font-size:21px;color:var(--verde-scuro);}
.modal-header p{margin:4px 0 0;font-size:13px;color:var(--testo-mut);}
.modal-close{background:var(--verde-tint);color:var(--verde-testo);width:32px;height:32px;border-radius:50%;font-size:16px;}
.modal-body{padding:20px 26px 26px;max-height:70vh;overflow-y:auto;}
.modal-section{margin-bottom:22px;}
.modal-section h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--testo-mut);margin:0 0 10px;}
.event-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:10px;background:#f8faf7;margin-bottom:6px;font-size:13.5px;}
.event-row .ev-left{display:flex;flex-direction:column;}
.event-row .ev-cli{font-weight:600;}
.event-row .ev-meta{font-size:11.5px;color:var(--testo-mut);}
.event-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.03em;}
.tag-attivazione{background:var(--verde-tint2);color:var(--verde-testo);}
.tag-gettone{background:var(--oro-tint);color:var(--oro);}
.tag-perso{background:var(--rosso-tint);color:var(--rosso-tenue);}
.ev-value{font-weight:700;font-variant-numeric:tabular-nums;}
.empty-note{font-size:13px;color:var(--testo-mut);font-style:italic;padding:8px 0;}
.modal-total{
  display:flex;justify-content:space-between;align-items:center;background:var(--verde-scuro);color:#fff;
  border-radius:14px;padding:16px 20px;margin-top:6px;
}
.modal-total b{font-family:'Fraunces',serif;font-size:26px;}

/* ---------- parametri modal ---------- */
.param-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;}
.param-field{display:flex;flex-direction:column;gap:5px;}
.param-field label{font-size:12px;color:var(--testo-mut);font-weight:600;}
.param-field .hint{font-size:10.5px;color:#9aa39a;}
.param-field input{
  border:1px solid var(--bordo);border-radius:10px;padding:9px 11px;font-family:inherit;font-size:14px;
  background:var(--crema);
}
.param-field input:focus{outline:none;border-color:var(--verde-vivo);background:#fff;}
.param-divider{grid-column:1/-1;border-top:1px solid var(--bordo);margin:6px 0;padding-top:10px;font-size:12px;font-weight:700;color:var(--verde-testo);text-transform:uppercase;letter-spacing:.03em;}

.footer-note{text-align:center;color:var(--testo-mut);font-size:11.5px;margin-top:36px;}
</style>

<body>
<div id="app">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">M</div>
      <div>
        <div class="brand-title">Canvass Nuove Attivazioni</div>
        <div class="brand-sub">Calcolo premi rete agenti — Mosnel</div>
      </div>
    </div>
    <div class="topbar-actions" id="topbarActions"></div>
  </div>

  <div id="screenImport"></div>
  <div id="screenDashboard" class="hidden"></div>

</div>

<div id="modalRoot"></div>

<script>
/* =========================================================================
   CANVASS NUOVE ATTIVAZIONI — motore di calcolo premi rete agenti Mosnel
   Un solo file HTML, nessun backend, nessuna dipendenza dati esterna.
   ========================================================================= */

/* ---------------- 1. PARAMETRI DI DEFAULT (piano incentivi) ---------------- */
const PARAMETRI_DEFAULT = {
  premio3: 40,
  premio4: 50,
  premio5: 60,
  gettonePrestige: 40,
  retentionValore: 50,
  referenzeMinime: 3,
  casseMinimePerReferenza: 1,   // 1 cassa = 6 bottiglie
  finestraMesi: 12,
  ordineMinimoCasse: 8,         // 7+1 = 7 pagate + 1 omaggio = 8 casse totali
  periodoInizio: null,          // 'YYYY-MM', calcolato al primo avvio
  periodoFine: null
};

function defaultPeriodo(){
  const now = new Date();
  const anno = now.getFullYear();
  return { inizio: anno + '-09', fine: anno + '-12' };
}

/* ---------------- 2. STATO GLOBALE ---------------- */
let STATE = {
  rows: [],            // righe grezze filtrate, una per riga Excel
  orders: [],          // righe aggregate per ordine (Cod_Cli + Num_Doc)
  importReport: null,  // { totRighe, scartate, agenti, clienti, dataMin, dataMax, motivi }
  parametri: JSON.parse(JSON.stringify(PARAMETRI_DEFAULT)),
  risultati: [],        // output motore di calcolo, un elemento per agente
  sortCol: 'totale',
  sortDir: 'desc',
  search: ''
};

const LS_KEY = 'canvass_mosnel_v1';

/* ---------------- 3. IMPORT & FILTRI EXCEL ---------------- */

function normalizza(s){ return (s===undefined||s===null) ? '' : String(s).trim(); }

function importaExcel(file){
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const wb = XLSX.read(e.target.result, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(sheet, {defval:''});
      processaImport(json);
    }catch(err){
      alert('Errore nella lettura del file: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function processaImport(json){
  let scartate = 0;
  const motivi = {};
  const scarta = (motivo)=>{ scartate++; motivi[motivo]=(motivi[motivo]||0)+1; };

  const AGENTI_ESCLUSI = new Set(['999','99','95']);
  const rows = [];

  json.forEach(r=>{
    const codAge = normalizza(r.Cod_Age);
    const nomeAgente = normalizza(r.Nome_Agente);
    const stato = normalizza(r.Stato).toUpperCase();
    const descr = normalizza(r.Descr_Merceologica);
    const nomeUp = nomeAgente.toUpperCase();

    // --- Filtri fissi (identici alla logica validata nel foglio Excel) ---
    if (AGENTI_ESCLUSI.has(codAge)) { scarta('agente escluso (999/99/95)'); return; }
    if (nomeUp.includes('PROVA') || nomeUp.includes('WINE CLUB')) { scarta('agente PROVA/WINE CLUB'); return; }
    if (descr.toUpperCase() === 'FONTECOLO') { scarta('riga FONTECOLO (olio)'); return; }
    if (!descr) { scarta('riga senza referenza'); return; }
    if (stato !== '_ITALIA') { scarta('Stato diverso da _ITALIA'); return; }

    const anno = parseInt(r.Anno, 10);
    const mese = parseInt(r.Mese, 10);
    if (!anno || !mese) { scarta('Anno/Mese mancante o non valido'); return; }

    rows.push({
      codCli: normalizza(r.Cod_Cli),
      codAge: codAge || nomeAgente,
      nomeAgente: nomeAgente || ('Agente ' + codAge),
      anno, mese,
      numDoc: normalizza(r.Num_Doc),
      descrMerc: descr,
      qtaPezzi: parseFloat(r.Qta_Pezzi) || 0,
      importoNetto: parseFloat(r.Importo_Netto) || 0,
      regione: normalizza(r.Regione),
      stato
    });
  });

  const orders = buildOrders(rows);

  const agenti = new Set(rows.map(r=>r.codAge));
  const clienti = new Set(rows.map(r=>r.codCli));
  let dataMin = null, dataMax = null;
  rows.forEach(r=>{
    const idx = r.anno*12+r.mese;
    if(dataMin===null || idx<dataMin) dataMin = idx;
    if(dataMax===null || idx>dataMax) dataMax = idx;
  });

  STATE.rows = rows;
  STATE.orders = orders;
  STATE.importReport = {
    totRighe: json.length,
    righeValide: rows.length,
    scartate, motivi,
    agenti: agenti.size,
    clienti: clienti.size,
    dataMin, dataMax
  };

  if(!STATE.parametri.periodoInizio){
    const p = defaultPeriodo();
    STATE.parametri.periodoInizio = p.inizio;
    STATE.parametri.periodoFine = p.fine;
  }

  ricalcola();
  salvaLocale();
  renderImportReport();
}

// Aggrega le righe per ordine (Cod_Cli + Num_Doc): un ordine puo' contenere piu' referenze
function buildOrders(rows){
  const map = new Map();
  rows.forEach(r=>{
    const key = r.codCli + '||' + r.numDoc;
    if(!map.has(key)){
      map.set(key, {
        codCli: r.codCli, numDoc: r.numDoc,
        codAge: r.codAge, nomeAgente: r.nomeAgente,
        anno: r.anno, mese: r.mese, monthIndex: r.anno*12+r.mese,
        referenze: new Map(), // descrizione -> qta pezzi totale
        importoNetto: 0
      });
    }
    const o = map.get(key);
    o.referenze.set(r.descrMerc, (o.referenze.get(r.descrMerc)||0) + r.qtaPezzi);
    o.importoNetto += r.importoNetto;
  });
  return Array.from(map.values());
}

/* ---------------- 4. MOTORE DI CALCOLO PREMI ---------------- */
/*
  Per ogni cliente si ricostruisce l'intero storico ordini (non solo il
  periodo selezionato), perche' per stabilire se un cliente e' "nuovo" o
  "perso" serve la finestra mobile di 12 mesi che puo' guardare fuori dal
  periodo. I premi vengono pero' SEMPRE attribuiti solo se l'evento generatore
  (primo ordine qualificante, prima referenza prestige, perdita del cliente)
  cade dentro il periodo selezionato.
*/
function meseAIndice(str){ // 'YYYY-MM' -> intero comparabile
  const [y,m] = str.split('-').map(Number);
  return y*12+m;
}

function motoreCalcolo(orders, parametri){
  const startIdx = meseAIndice(parametri.periodoInizio);
  const endIdx = meseAIndice(parametri.periodoFine);
  const {
    finestraMesi, casseMinimePerReferenza, referenzeMinime, ordineMinimoCasse,
    premio3, premio4, premio5, gettonePrestige, retentionValore
  } = parametri;

  // Raggruppa ordini per cliente, ordinati cronologicamente
  const clientMap = new Map();
  orders.forEach(o=>{
    if(!clientMap.has(o.codCli)) clientMap.set(o.codCli, []);
    clientMap.get(o.codCli).push(o);
  });
  clientMap.forEach(list=>list.sort((a,b)=>a.monthIndex-b.monthIndex));

  const agentiMap = new Map(); // codAge -> risultati
  function agente(codAge, nome){
    if(!agentiMap.has(codAge)){
      agentiMap.set(codAge, { codAge, nome, attivazioni:[], gettoni:[], persi:[] });
    }
    const a = agentiMap.get(codAge);
    if(nome) a.nome = nome;
    return a;
  }

  clientMap.forEach((storicoOrdini, codCli)=>{
    const ordiniPeriodo = storicoOrdini.filter(o=>o.monthIndex>=startIdx && o.monthIndex<=endIdx);

    // ---- 4.1 PREMIO ATTIVAZIONE (regola: nuovo cliente + N referenze + ordine minimo) ----
    if(ordiniPeriodo.length>0){
      const primoOrdine = ordiniPeriodo[0];
      const haStoricoRecente = storicoOrdini.some(o =>
        o.monthIndex < primoOrdine.monthIndex &&
        o.monthIndex >= primoOrdine.monthIndex - finestraMesi
      );
      const isNuovo = !haStoricoRecente;

      const refEntries = Array.from(primoOrdine.referenze.entries()).map(([descr, qta])=>({
        descr, casse: qta/6
      }));
      const referenzeValide = refEntries.filter(r => r.casse >= casseMinimePerReferenza);
      const totaleCasseOrdine = refEntries.reduce((s,r)=>s+r.casse, 0);

      if(isNuovo && referenzeValide.length >= referenzeMinime && totaleCasseOrdine >= ordineMinimoCasse){
        const fascia = referenzeValide.length >= 5 ? 5 : referenzeValide.length; // 3, 4 o 5+
        const premio = fascia === 3 ? premio3 : fascia === 4 ? premio4 : premio5;
        const ag = agente(primoOrdine.codAge, primoOrdine.nomeAgente);
        ag.attivazioni.push({
          codCli, monthIndex: primoOrdine.monthIndex, fascia, premio,
          referenze: referenzeValide.map(r=>r.descr)
        });
      }
    }

    // ---- 4.2 GETTONE PRESTIGE (prima volta EBB o Parose in assoluto, su tutto lo storico) ----
    let ebbGiaAvuto = false, paroseGiaAvuto = false;
    storicoOrdini.forEach(o=>{
      let presenteEBB = false, presenteParose = false;
      o.referenze.forEach((qta, descr)=>{
        const d = descr.toUpperCase();
        if(qta > 0 && d.includes('EBB')) presenteEBB = true;
        if(qta > 0 && d.includes('PAROS')) presenteParose = true; // copre Parose/Parosé
      });
      const inPeriodo = o.monthIndex >= startIdx && o.monthIndex <= endIdx;

      if(presenteEBB && !ebbGiaAvuto){
        if(inPeriodo){
          const ag = agente(o.codAge, o.nomeAgente);
          ag.gettoni.push({ codCli, monthIndex:o.monthIndex, referenza:'EBB', importo:gettonePrestige });
        }
        ebbGiaAvuto = true;
      }
      if(presenteParose && !paroseGiaAvuto){
        if(inPeriodo){
          const ag = agente(o.codAge, o.nomeAgente);
          ag.gettoni.push({ codCli, monthIndex:o.monthIndex, referenza:'Parosé', importo:gettonePrestige });
        }
        paroseGiaAvuto = true;
      }
    });

    // ---- 4.3 CLIENTI PERSI (dormienti da almeno `finestraMesi` mesi pieni, misurato a fine periodo) ----
    // Nota: non richiede piu' che il cliente fosse "attivo appena prima" del periodo. Si guarda
    // l'ultimo ordine registrato fino alla fine del periodo (endIdx compreso) e si calcolano i mesi
    // trascorsi da allora. Se un cliente dormiente viene RIATTIVATO durante il periodo, il suo ultimo
    // ordine ricade dentro il periodo stesso, quindi automaticamente non risulta piu' "perso": va a
    // sommarsi invece alle nuove attivazioni (vedi 4.1). Questo evita di penalizzare un agente due
    // volte per lo stesso cliente e rende il saldo netto uno specchio reale del lavoro fatto nel periodo.
    const ordiniFinoAFinePeriodo = storicoOrdini.filter(o => o.monthIndex <= endIdx);
    if(ordiniFinoAFinePeriodo.length > 0){
      const ultimo = ordiniFinoAFinePeriodo[ordiniFinoAFinePeriodo.length-1];
      const mesiDormienza = endIdx - ultimo.monthIndex;
      if(mesiDormienza >= finestraMesi){
        const ag = agente(ultimo.codAge, ultimo.nomeAgente);
        ag.persi.push({ codCli, ultimoAcquisto: ultimo.monthIndex, mesiDormienza });
      }
    }
  });

  // ---- 4.4 TOTALI PER AGENTE ----
  const risultati = Array.from(agentiMap.values()).map(ag=>{
    const totPremiAttivazione = ag.attivazioni.reduce((s,a)=>s+a.premio, 0);
    const totGettoni = ag.gettoni.reduce((s,g)=>s+g.importo, 0);
    const saldoNetto = ag.attivazioni.length - ag.persi.length;
    const retention = saldoNetto > 0 ? saldoNetto * retentionValore : 0;
    return {
      ...ag,
      nuoviQualificati: ag.attivazioni.length,
      persiCount: ag.persi.length,
      saldoNetto,
      totPremiAttivazione, totGettoni, retention,
      totale: totPremiAttivazione + totGettoni + retention
    };
  });

  return risultati;
}

function ricalcola(){
  if(STATE.orders.length===0) return;
  STATE.risultati = motoreCalcolo(STATE.orders, STATE.parametri);
}

function fmt(n){ return '€ ' + Math.round(n).toLocaleString('it-IT'); }

// Selettori mese/anno "a prova di browser": Safari non supporta <input type="month">,
// quindi il periodo campagna si sceglie con due <select> invece dell'input nativo.
const NOMI_MESE = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];

function selectMese(id, valorePeriodo){
  const meseSel = valorePeriodo ? parseInt(valorePeriodo.split('-')[1], 10) : (new Date().getMonth()+1);
  const opzioni = NOMI_MESE.map((nome,i)=>{
    const m = i+1;
    const mm = String(m).padStart(2,'0');
    return `<option value="${mm}" ${m===meseSel?'selected':''}>${nome}</option>`;
  }).join('');
  return `<select id="${id}">${opzioni}</select>`;
}

function selectAnno(id, valorePeriodo){
  const annoSel = valorePeriodo ? parseInt(valorePeriodo.split('-')[0], 10) : new Date().getFullYear();
  // range di anni: da quelli presenti nei dati importati (con margine), cosi' copre sempre il file caricato
  let annoMin = annoSel-1, annoMax = annoSel+1;
  if(STATE.importReport && STATE.importReport.dataMin && STATE.importReport.dataMax){
    annoMin = Math.min(annoMin, Math.floor((STATE.importReport.dataMin-1)/12));
    annoMax = Math.max(annoMax, Math.floor((STATE.importReport.dataMax-1)/12));
  }
  let opzioni = '';
  for(let y=annoMin; y<=annoMax; y++){
    opzioni += `<option value="${y}" ${y===annoSel?'selected':''}>${y}</option>`;
  }
  return `<select id="${id}">${opzioni}</select>`;
}

const COLONNE = [
  {key:'nome', label:'Agente'},
  {key:'nuoviQualificati', label:'Nuovi', num:true},
  {key:'persiCount', label:'Persi', num:true},
  {key:'saldoNetto', label:'Saldo netto', num:true},
  {key:'totPremiAttivazione', label:'Premi attiv.', num:true},
  {key:'totGettoni', label:'Gettoni', num:true},
  {key:'retention', label:'Retention', num:true},
  {key:'totale', label:'Totale', num:true}
];

function renderTable(){
  const head = document.getElementById('tableHead');
  const body = document.getElementById('tableBody');
  if(!head || !body) return;

  head.innerHTML = COLONNE.map(c=>{
    const arrow = STATE.sortCol===c.key ? (STATE.sortDir==='desc'?' ↓':' ↑') : '';
    return `<th onclick="ordinaPer('${c.key}')">${c.label}${arrow}</th>`;
  }).join('');

  let rows = STATE.risultati.slice();
  if(STATE.search.trim()){
    const q = STATE.search.toLowerCase();
    rows = rows.filter(r => (r.nome||'').toLowerCase().includes(q));
  }
  rows.sort((a,b)=>{
    const dir = STATE.sortDir==='desc' ? -1 : 1;
    const av = a[STATE.sortCol], bv = b[STATE.sortCol];
    if(typeof av === 'string') return av.localeCompare(bv)*dir;
    return (av-bv)*dir;
  });

  if(rows.length===0){
    body.innerHTML = `<tr><td colspan="${COLONNE.length}" style="padding:30px;text-align:center;color:var(--testo-mut);">Nessun agente trovato con i filtri attuali.</td></tr>`;
    return;
  }

  body.innerHTML = rows.map(r=>{
    const saldoClass = r.saldoNetto>0?'saldo-pos':(r.saldoNetto<0?'saldo-neg':'saldo-zero');
    const dotClass = r.saldoNetto>0?'dot-pos':(r.saldoNetto<0?'dot-neg':'dot-zero');
    return `
      <tr onclick="apriDettaglioAgente('${r.codAge.replace(/'/g,"\\'")}')">
        <td>${r.nome}</td>
        <td class="num">${r.nuoviQualificati}</td>
        <td class="num">${r.persiCount}</td>
        <td class="num"><span class="saldo-badge ${saldoClass}"><span class="dot ${dotClass}"></span>${r.saldoNetto>0?'+':''}${r.saldoNetto}</span></td>
        <td class="num">${fmt(r.totPremiAttivazione)}</td>
        <td class="num">${fmt(r.totGettoni)}</td>
        <td class="num">${fmt(r.retention)}</td>
        <td class="num tot-cell">${fmt(r.totale)}</td>
      </tr>
    `;
  }).join('');
}

function ordinaPer(key){
  if(STATE.sortCol===key){ STATE.sortDir = STATE.sortDir==='desc'?'asc':'desc'; }
  else { STATE.sortCol = key; STATE.sortDir = 'desc'; }
  renderTable();
}

  const ag = STATE.risultati.find(r=>r.codAge===codAge);

  const eventiAttivazione = ag.attivazioni.slice().sort((a,b)=>b.monthIndex-a.monthIndex).map(a=>`

  `).join('') || '<div class="empty-note">Nessun gettone prestige nel periodo.</div>';

  const eventiPersi = ag.persi.slice().sort((a,b)=>b.ultimoAcquisto-a.ultimoAcquisto).map(p=>`
    <div class="event-row">
      <div class="ev-left">
        <span class="ev-cli">Cliente ${p.codCli}</span>

      </div>
      <span class="event-tag tag-perso">Perso</span>

  `).join('') || '<div class="empty-note">Nessun cliente perso nel periodo.</div>';

  document.getElementById('modalRoot').innerHTML = `

          </div>
          <div class="modal-section">
            <h4>Gettoni prestige EBB / Parosé (${ag.gettoni.length})</h4>
            ${eventiGettone}
          </div>
          <div class="modal-section">
            <h4>Clienti persi (${ag.persi.length}) — saldo netto ${ag.saldoNetto>0?'+':''}${ag.saldoNetto}</h4>
            ${eventiPersi}
          </div>
          <div class="modal-total">
            <span>Totale da liquidare</span>
            <b>${fmt(ag.totale)}</b>
          </div>
        </div>

    'Agente': r.nome,

  const totRow = {

    'Saldo netto': STATE.risultati.reduce((s,a)=>s+a.saldoNetto,0),

    'Gettoni prestige (€)': Math.round(STATE.risultati.reduce((s,a)=>s+a.totGettoni,0)),
    'Retention (€)': Math.round(STATE.risultati.reduce((s,a)=>s+a.retention,0)),
    'Totale da liquidare (€)': Math.round(STATE.risultati.reduce((s,a)=>s+a.totale,0))
  };
  righeTabella.push(totRow);

  const parametriRighe = [

/* ---------------- 11. SALVATAGGIO / RIPRESA LOCALE ---------------- */
/*
  Nota: window.localStorage funziona nell'ambiente reale (es. hostato su
  GitHub Pages, come gli altri tool Mosnel) ma puo' non persistere se il file
  viene aperto in anteprima sandbox di Claude. In quel caso l'app funziona
  comunque, semplicemente non ricorda tra una sessione e l'altra.
*/
function salvaLocale(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({
      rows: STATE.rows, importReport: STATE.importReport,
      parametri: STATE.parametri, savedAt: new Date().toISOString()
    }));
  }catch(e){ /* storage non disponibile: si prosegue senza persistenza */ }
}

function caricaLocale(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}

function riprendiSessione(dati){
  STATE.rows = dati.rows;
  STATE.orders = buildOrders(dati.rows);
  STATE.importReport = dati.importReport;
  STATE.parametri = dati.parametri;
  ricalcola();
  vaiAllaDashboard();
}

/* ---------------- 12. AVVIO ---------------- */
function avvia(){
  renderTopbar();
  renderImportScreen();

  const salvato = caricaLocale();
  if(salvato && salvato.rows && salvato.rows.length>0){
    window.__sessioneSalvata = salvato; // evita di iniettare JSON enorme in un attributo HTML
    const wrap = document.getElementById('importReportWrap');
    const dataSalvataggio = new Date(salvato.savedAt).toLocaleString('it-IT');
    const banner = document.createElement('div');
    banner.className = 'import-report';
    banner.innerHTML = `
      <h3>Calcolo precedente trovato</h3>
      <p style="font-size:13px;color:var(--testo-mut);margin:0 0 14px;">
        Ultimo salvataggio: ${dataSalvataggio} — ${salvato.rows.length.toLocaleString('it-IT')} righe importate.
      </p>
      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button class="btn btn-ghost btn-sm" onclick="this.closest('.import-report').remove()">Ignora</button>
        <button class="btn btn-primary btn-sm" onclick="riprendiSessione(window.__sessioneSalvata)">Riprendi ultimo calcolo →</button>
      </div>
    `;
    wrap.prepend(banner);
  }
}
avvia();
</script>
</body>
</html>
